# Dependabot configuration for diluxone-users-wordpress.
#
# Why this exists, even though the published plugin has zero production
# dependencies: the GitHub Actions this repository's own workflows use are a
# supply-chain surface (the deploy one holds the wordpress.org SVN
# credentials). Dependabot watches them; after the move to DiluxOne, the
# shared workflows in DiluxOne/.github have their own Dependabot, and the
# pins to them are bumped here as reusable-workflow references.
#
# Also covers npm devDependencies (@wordpress/env, Playwright) and Composer
# dev tooling, which run locally and in CI. None of these dependencies ever
# ship to wordpress.org: .distignore excludes them.
#
# Weekly, grouped: at most a couple of PRs a week, not one per package.
# Combined with the required checks on main, a Dependabot PR that goes green
# can be merged confidently.
#
# Commit prefix + include: scope yields Conventional Commit titles that the
# shared conventions check accepts: "ci(deps): Bump …", "build(deps-dev): Bump …".

version: 2
updates:
  # GitHub Actions used in .github/workflows/. The shared DiluxOne/.github
  # workflows land in a group of their own so a pin bump is never mixed with
  # action bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    groups:
      diluxone-central:
        patterns:
          - "DiluxOne/.github*"
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # npm dev dependencies (@wordpress/env, Playwright). We never ship npm
  # packages, so all updates are dev-only.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "build"
      include: "scope"

  # Composer dev dependencies (PHPUnit, brain/monkey, mockery, PHPStan,
  # Psalm, WPCS). All dev-only; the plugin runtime never invokes Composer,
  # and vendor/ never reaches wordpress.org (.distignore).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    groups:
      composer-dev:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "composer"
    commit-message:
      prefix: "build"
      include: "scope"
