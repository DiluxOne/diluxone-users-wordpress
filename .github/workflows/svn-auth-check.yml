name: SVN credentials check

# Run by hand after rotating the wordpress.org SVN password: proves the
# secrets in the `wordpress-org` environment authenticate, without
# publishing anything (the shared workflow in DiluxOne/.github, pinned to a
# commit like the release: it runs with the same credentials).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: DiluxOne/.github/.github/workflows/svn-auth-check.yml@bffb48e7e962305b84a9d70fd0abacfdfd73422d # v5.6.1
    # An environment's secrets reach a called job only through `inherit`,
    # which also passes every repository and organisation secret; hence the
    # by-hand trigger and the pinned commit.
    secrets: inherit
