name: Integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    name: Integration tests (wp-env)
    runs-on: ubuntu-latest
    # Container start + plugin activation + tests + container stop.
    # Worst case observed: ~7 minutes. 15 leaves margin for cold-start
    # Docker image pulls.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-integration-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-integration-${{ runner.os }}-

      - name: Install Composer dependencies
        # The vendor/ tree produced here is then mounted into the wp-env
        # container as part of the plugin volume — that's how the
        # container can reach phpunit at
        # /var/www/html/wp-content/plugins/diluxone-users-wordpress/vendor/.
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        # No package-lock.json is committed (currently), so use `install`
        # rather than `ci`.
        run: npm install --no-audit --no-fund

      - name: Start wp-env
        # Brings up two WordPress containers — dev (port 8892) and tests
        # (port 8893) — plus a shared MySQL. Plugin is auto-mounted.
        run: npx wp-env start

      - name: Convert the tests site into a network, and network-activate the plugin
        # The suite runs on a multisite network, as the shared CI of the
        # DiluxOne organisation runs it: the network tests (MultisiteTest) are
        # skipped on a single site, and a good part of real hosting is a
        # network. Everything else passes on both.
        #
        # The folder is the repository name and not the slug: wp-env mounts
        # the checkout as it is. What wordpress.org receives under the slug is
        # a separate tree, built by `make dist`.
        run: |
          npx wp-env run tests-cli wp core multisite-convert --title="Tests network"
          npx wp-env run tests-cli wp plugin activate diluxone-users-wordpress --network

      - name: Run integration tests
        run: npx wp-env run tests-cli ./wp-content/plugins/diluxone-users-wordpress/vendor/bin/phpunit -c ./wp-content/plugins/diluxone-users-wordpress/phpunit-integration.xml

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
