name: End-to-end tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: End-to-end tests (Playwright + wp-env)
    runs-on: ubuntu-latest
    # A browser, a WordPress container and ninety flows. The suite itself runs
    # in about two minutes locally; the rest of the budget is the cold-start
    # image pull and the Chromium download on a runner with no cache.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        # Only Chromium: the passkey specs drive a virtual authenticator, which
        # is a DevTools-protocol feature with no equivalent elsewhere, and the
        # suite declares one project.
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        # The dev site (8892) is what the suite drives, and it mounts the
        # working tree — so what is tested is this commit. The mu-plugin that
        # gives the tests a mailbox and a fake social network is mapped in
        # .wp-env.json.
        run: npx wp-env start

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Keep the trace of whatever failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            build/e2e-results
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
