# DiluxOne Users+'s review policy, added to the organisation defaults in
# DiluxOne/.github (policy/review-policy.default.yml). Read before the Claude
# review; the review can raise the risk these rules set, never lower it.

# The kind of project: its rules, review profile and checks are the
# organisation's pack for it (DiluxOne/.github, kinds/wordpress-plugin/).
kind: wordpress-plugin

# Code where a mistake lets the wrong person in, locks the right one out,
# leaks somebody's data or breaks every site: always high risk, always a
# human merge.
high-risk:
  - "diluxone-users.php"
  - "uninstall.php"
  # Signing in: the second factor, passkeys, the ways in, the e-mail link.
  - "includes/auth*.php"
  - "includes/login*.php"
  - "includes/passwordless.php"
  # Social login: who a provider's identity is handed to.
  - "includes/sso*.php"
  # Accounts being created, recovered, kept open, and where from.
  - "includes/register.php"
  - "includes/reset.php"
  - "includes/sessions.php"
  - "includes/client-ip.php"
  # What must not leak between the sites of a network.
  - "includes/multisite.php"
  # People's data: export, erasure, the activity log, the fields they fill in.
  - "includes/privacy.php"
  - "includes/log*.php"
  - "includes/fields.php"
  - "includes/fields-forms.php"
  # Everything printed on the front end.
  - "templates/**"

# Every review setting can be overridden here, key by key; what is left out
# keeps the organisation's default (policy/review-policy.default.yml in
# DiluxOne/.github): the reviewer per risk level (model id as the API names
# it; effort low, medium, high, xhigh or max), the budget per run and whether
# qualifying pull requests merge on their own. Uncomment to change it for this
# repository only.
#
# review:
#   medium: { model: claude-sonnet-5-5, effort: medium }
#   high:   { model: claude-sonnet-5-5, effort: high }
# budget-usd: 3
# auto-merge: true
