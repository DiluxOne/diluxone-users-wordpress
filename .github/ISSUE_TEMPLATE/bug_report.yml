name: 🐛 Bug report
description: Report a defect — something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before submitting, please confirm:

        - This is a **defect in the plugin code**, not a usage question (those go to the [wordpress.org support forum](https://wordpress.org/support/plugin/diluxone-users/) once the plugin is published).
        - This is **not a security vulnerability**, such as someone getting into an account that is not theirs (those go to [GitHub Security Advisories](https://github.com/DiluxOne/diluxone-users-wordpress/security/advisories/new)).
        - You have searched [existing issues](https://github.com/DiluxOne/diluxone-users-wordpress/issues?q=is%3Aissue) and this is not a duplicate.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug. What did you expect to happen, and what happened instead?
      placeholder: When I open the sign-in link from the e-mail, I land on the sign-in page again instead of being signed in.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps that reliably trigger the bug, starting from the settings that matter (Access, Security, Social login…).
      placeholder: |
        1. In Access, set the ways in to '...'
        2. Sign out and open '...'
        3. See error
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: As shown on the Plugins screen, or under DiluxOne Users+ → Maintenance.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
      placeholder: "7.1"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.2"
    validations:
      required: true

  - type: dropdown
    id: multisite
    attributes:
      label: Single site or multisite network?
      options:
        - Single site
        - Multisite, plugin network-activated
        - Multisite, plugin activated on some sites
    validations:
      required: true

  - type: dropdown
    id: way-in
    attributes:
      label: Which way in is involved?
      description: Pick every one that is part of the problem.
      multiple: true
      options:
        - E-mail link (passwordless)
        - Username and password
        - Social provider
        - Passkey
        - Second factor by e-mail code
        - Second factor by authenticator app
        - Backup code
        - None, it is not about signing in
    validations:
      required: true

  - type: input
    id: social-provider
    attributes:
      label: Social provider, if any
      placeholder: Google, Microsoft, GitHub…

  - type: input
    id: theme
    attributes:
      label: Theme
      description: The active theme, and whether it is a block theme or a classic one if you know.
      placeholder: Twenty Twenty-Five

  - type: textarea
    id: other-plugins
    attributes:
      label: Other authentication or security plugins
      description: Anything else that touches sign-in, registration, sessions or users (security suites, other 2FA, other social login, membership plugins, caching of logged-in pages). "None" is a useful answer.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error messages
      description: Entries from `wp-content/debug.log`, the browser console, or the plugin's activity log. **Redact codes, links, client secrets, e-mail addresses and any other personal data before pasting.**
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Host, cache or CDN in front of the site, anything else that might be relevant.
